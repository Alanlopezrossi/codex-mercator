name: Wiki hearts
# One-off (manual) extraction of renown heart vendors from the archived Guild Wars 2 Wiki.
# Commits data/heart-vendors.json; the next deploy picks it up.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-save cheerio@1.0.0
      - run: node scripts/fetch-wiki-hearts.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/heart-vendors.json
          git diff --cached --quiet || git commit -m "Data: renown heart vendors from the archived wiki"
          git push
