name: Daily check
# Every day: build with the real official API (validates the data) and check the live site and the API endpoints.
on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build with the real API
        run: npm run build
      - name: Live site and API
        run: node tests/live-check.mjs
