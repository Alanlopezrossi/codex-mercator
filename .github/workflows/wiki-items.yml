name: Wiki items
# One-off (manual) extraction of the "Acquisition" section of every item page from the archived Guild Wars 2 Wiki.
# Runs in parallel shards, then merges into data/wiki-data.json and commits; the next deploy picks it up.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Pages per shard (0 = all). Use a small number for a test run (no commit).'
        default: '0'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-save cheerio@1.0.0
      - run: node scripts/fetch-wiki-items.mjs
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 6
          LIMIT: ${{ inputs.limit }}
      - uses: actions/upload-artifact@v4
        with:
          name: wiki-items-${{ matrix.shard }}
          path: .cache/wiki-items-${{ matrix.shard }}.json
  merge:
    needs: extract
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v4
        with:
          path: .cache/parts
      - run: node scripts/merge-wiki-items.mjs .cache/parts
      - name: Commit
        if: ${{ inputs.limit == '0' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wiki-data.json
          git diff --cached --quiet || git commit -m "Data: item acquisition from the archived wiki"
          git pull --rebase
          git push
      - name: Sample (test run)
        if: ${{ inputs.limit != '0' }}
        run: node -e "const d=require('./data/wiki-data.json');const e=Object.entries(d.items).slice(-6);console.log(JSON.stringify(e,null,1).slice(0,6000))"
